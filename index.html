<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>rogue-ai</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0e1016; }
      #unity-container { position: fixed; inset: 0; }
      /* The canvas fills the window at every size; Unity sizes its render target from the DOM size.
         The default template instead renders a fixed 1600x900 canvas that crops in smaller windows. */
      #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #0e1016; outline: none; touch-action: none; }
      #unity-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #cfd6e6; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0e1016; }
      #unity-loading h1 { font-size: 30px; font-weight: 500; letter-spacing: 3px; margin: 0 0 18px; text-transform: lowercase; }
      #unity-bar { width: 300px; height: 6px; background: #1c2130; border: 1px solid #2c3550; border-radius: 3px; overflow: hidden; }
      #unity-bar-fill { width: 0; height: 100%; background: #5b8def; }
      #unity-hint { margin-top: 18px; color: #7c869c; font-size: 13px; }
      #unity-warning { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); color: #fff; font: 14px sans-serif; }
      #unity-warning div { margin: 4px 0; padding: 8px 12px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <h1>rogue-ai</h1>
        <div id="unity-bar"><div id="unity-bar-fill"></div></div>
        <div id="unity-hint">gamepad · keyboard (WASD, J, Space) · touch</div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        banner.appendChild(div);
        if (type == "error") div.style.background = "#8a1f1f";
        else {
          div.style.background = "#2c3550";
          setTimeout(function () { banner.removeChild(div); }, 5000);
        }
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        symbolsUrl: buildUrl + "/Web.symbols.json.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ianiterate",
        productName: "rogue-ai",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // Cap the pixel ratio so a retina display is not asked to shade four times the pixels.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/Web.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-bar-fill").style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          document.querySelector("#unity-loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
